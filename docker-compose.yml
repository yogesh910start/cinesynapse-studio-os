version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cinesynapse-backend
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
      - CLICKHOUSE_MOCK_FALLBACK=true
    volumes:
      - ./backend:/app/backend
      - ./sample_assets:/app/sample_assets
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: cinesynapse-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
