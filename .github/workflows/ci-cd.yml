name: CINE-SYNAPSE Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: cine-synapse-prod
  REGION: us-central1
  SERVICE_NAME: cinesynapse-studio-os
  IMAGE_NAME: gcr.io/cine-synapse-prod/studio-os

jobs:
  code-quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Syntax & Bytecode Compilation Check
        run: python -m compileall backend/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Static Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend Production Bundle Verification
        working-directory: frontend
        run: npm run build

  backend-tests:
    name: Automated Unit, SRE & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest Test Suite
        run: PYTHONPATH=. pytest backend/tests/ -v

  docker-build:
    name: Multi-Stage Container Image Build
    needs: [code-quality, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: cinesynapse/studio-os:latest

  cloud-run-deploy:
    name: Google Cloud Run Continuous Deployment
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.repository_owner != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (If Secret Provided)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google Artifact Registry
        if: steps.auth.outcome == 'success'
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Production Container
        if: steps.auth.outcome == 'success'
        run: |
          docker build --target production -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Google Cloud Run
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: "--min-instances=1 --max-instances=10 --cpu=2 --memory=4Gi --port=8080"
