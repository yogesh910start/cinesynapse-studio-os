version: "3.8"

services:
  cinesynapse-studio-os:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cinesynapse/studio-os:latest
    container_name: cinesynapse-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=storage/local
    env_file:
      - .env.production
    volumes:
      - cinesynapse_storage:/app/backend/storage/local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M

volumes:
  cinesynapse_storage:
    name: cinesynapse_storage_volume
